name: Send shipping labels

on:
  schedule:
    # America/Sao_Paulo is UTC-3 year-round.
    # Morning redundancy: 08:00 and 09:00 BRT (11:00 and 12:00 UTC).
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    # Afternoon redundancy: 12:00 and 13:00 BRT (15:00 and 16:00 UTC).
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: shipping-labels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Send pending labels
        run: npm run labels
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}

          DB_URL: ${{ secrets.DB_URL }}
          DB_AUTH_TOKEN: ${{ secrets.DB_AUTH_TOKEN }}
          LABELS_MAX_ORDERS: '300'

          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp-relay.brevo.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          TIMEZONE: America/Sao_Paulo
